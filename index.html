    .fallback {

      font: 12px system-ui, sans-serif;
      background: rgba(255,255,255,.9); padding: 4px 8px; border-radius: 6px;
    }

</head>

    allow="camera; geolocation; clipboard-write"
    title="PGI Maintenance Checklist"></iframe>

     href="https://script.google.com/macros/s/AKfycbypeps3VttQloZ4bbd7SMP4Mfvk5PNrpwpcsPeLoIJdbR8l0iCWtPbNm_MbMdzPsWRYvA/exec">Not loading? Open directly</a>

    // Pass ?p=TNF&f=Flat%207 through to the web app so preset links still work

      var f = document.querySelector('iframe'), a = document.querySelector('.fallback');
      f.src += location.search; a.href += location.search;
    }
